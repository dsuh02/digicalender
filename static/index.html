<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>DigiCalender</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237aa2f7'/%3E%3Crect x='6' y='9' width='20' height='17' rx='3' fill='%230d0f14'/%3E%3Crect x='6' y='9' width='20' height='5' rx='2.5' fill='%23ff9e64'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/grid.css">
<link rel="stylesheet" href="/css/widgets.css">
</head>
<body>

<div id="app">
  <header class="topbar">
    <span class="brand">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 2v3M17 2v3M3 9h18M5 5h14a2 2 0 012 2v12a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2z"/>
      </svg>
      DigiCalender
    </span>

    <nav class="tabs" id="tabs" role="tablist"></nav>

    <span class="status" id="status" title="Live"></span>
    <button class="icon-btn" id="pageBtn" hidden aria-label="Page settings" title="Page settings">&#8943;</button>
    <button class="icon-btn" id="addBtn" hidden aria-label="Add widget" title="Add widget">+</button>
    <button class="icon-btn" id="editBtn" aria-pressed="false" aria-label="Edit layout" title="Edit layout">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 11V7a5 5 0 0110 0v4M5 11h14v10H5z"/>
      </svg>
    </button>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>
      </svg>
    </button>
  </header>

  <main class="stage" id="stage"></main>
</div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
